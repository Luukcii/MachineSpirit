<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' blob: data:; font-src 'self' data:; frame-src 'self' blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11161c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Machine Spirit">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Machine Spirit</title>
<style>
  :root { --bg: #11161c; --panel: #1a2129; --line: #2b343e; --text: #e8eaed; --muted: #9aa0a6; --accent: #ff8a1f; --bad: #ff6b6b; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 420px; margin: 0 auto; padding: calc(48px + env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 40px max(20px, env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 18px; }
  .mark { width: 64px; height: 64px; border-radius: 16px; }
  h1 { margin: 0; font-size: 28px; letter-spacing: .3px; }
  p { margin: 0; color: var(--muted); }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); }
  input { font: inherit; font-size: 20px; color: var(--text); background: var(--panel); border: 1.5px solid var(--line); border-radius: 12px; padding: 14px; width: 100%; }
  input:focus { outline: none; border-color: var(--accent); }
  button { font: inherit; font-weight: 800; font-size: 18px; color: #111; background: var(--accent); border: 0; border-radius: 14px; padding: 16px; width: 100%; }
  button:disabled { opacity: .6; }
  .err { color: var(--bad); min-height: 1.4em; }
  .hint { font-size: 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <img class="mark" src="apple-touch-icon.png" alt="">
  <h1>Machine Spirit</h1>
  <p id="msg">Opening…</p>
  <form id="f" hidden>
    <label for="pw">Shop passcode<input id="pw" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" enterkeyhint="go"></label>
    <p class="err" id="err" role="alert"></p>
    <button id="go" type="submit">Unlock</button>
    <p class="hint">Once per phone. After that it opens straight away, even with no signal. On iPhone: Share → Add to Home Screen first, then unlock from the home screen icon.</p>
  </form>
</main>
<script src="lock.js"></script>
</body>
</html>
